---
# Variables for phantom hosts in the "method_osbuild" group (all RHEL targets; see targets.yml dimension 4).
#
# build_method + builder_group (derived in all.yml) tell the build roles which inventory group contains the real
# builder machines. rhel_image_build uses builder_group to assign _builder_host once per phantom host via round-robin:
#
#   _builder_host: >-
#     {{ groups[builder_group][
#        ansible_play_hosts_all.index(inventory_hostname)
#        % (groups[builder_group] | length)] }}
#
# Since build_method = "osbuild", builder_group resolves to "builders_osbuild", picking from the EC2 instances
# discovered by aws_ec2.yml (tagged builder_type=osbuild). With a single builder this reduces to [0]. With multiple
# builders, targets are spread evenly. The assigned _builder_host persists as a host fact for the entire play, so all
# downstream roles (hardening, export, convert, etc.) delegate to the same builder that did the compose.
build_method: osbuild

# Blueprint directory on the builder host (builder_work_dir is defined in all.yml)
blueprint_dir: "{{ builder_work_dir }}/blueprints"

# cloud-init datasources are set per cloud provider in cloud_*.yml.
# Each cloud group_vars file lists its own datasource + NoCloud as a fallback.
