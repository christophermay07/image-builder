---
# Windows family settings (all Windows Server versions share these)
os_family: windows

# Packer connection settings; shared across all Windows versions.
#
# These exist because of the build method (Packer), but their values are determined by the OS family (Windows uses
# WinRM, but other OS families built using Packer would not use WinRM), so they live here rather than in
# method_packer.yml. See the inventory README.md file's "Where Do Variables Go?" section for additional details.
packer_instance_type: "m5.xlarge"
packer_communicator: "winrm"
packer_winrm_username: "Administrator"

# Windows STIG settings shared across all Windows versions.
#
# Used by windows_compliance_scan (pre-seal), windows_ami_validate (post-seal), windows_hardening, and
# artifact upload roles.

# PowerSTIG module version installed in the guest for compliance auditing.
powerstig_version: "4.30.0"

# SHA-256 hash of PowerSTIG.psd1 for post-install integrity verification.
# TODO: populate from a trusted Windows install (see windows_compliance_scan defaults for instructions).
powerstig_manifest_hash: ""

# NuGet package provider version. Pinned to prevent silent upgrades.
nuget_provider_version: "2.8.5.201"
