---
# GCP cloud-specific settings (Dimension 5)
#
# Variables here apply to every phantom host that targets GCP.
# Roles dispatch on group membership ("'cloud_gcp' in group_names").
#
# TODO: GCP native registration, smoke testing, approval, and distribution are not implemented.
# Complete cloud_convert, cloud_validate, image_release_approve, and image_distribute provider handlers.
# The common RHEL workflow blocks publication until native image registration and SSH validation succeed.

cloud_target: gcp

# cloud-init datasource ordering for GCP images.
# GCE is checked first; NoCloud is the fallback for local dev/test.
cloud_init_datasources:
  - GCE
  - NoCloud

# Chrony NTP configuration for GCP.
# GCP's metadata server doubles as an NTP server, reachable from any instance via the metadata.google.internal hostname.
# https://cloud.google.com/compute/docs/instances/configure-ntp
chrony_config: |
  server metadata.google.internal prefer iburst
  driftfile /var/lib/chrony/drift
  makestep 1.0 3
  rtcsync
  logdir /var/log/chrony

