---
# Linux profile defaults inherited by every profile.
# See README.md in this directory for composition rules and YAML syntax notes.

_base_linux_packages:
  - cloud-init
  - cloud-utils-growpart
  - scap-security-guide
  - openscap-scanner
  - aide
  - rsyslog
  - chrony
_profile_specific_linux_packages: []
#   - tuned-profiles-throughput-performance
#   - compat-c++-12
profile_linux_packages: "{{ _base_linux_packages + _profile_specific_linux_packages }}"

_base_linux_enabled_services:
  - cloud-init
  - cloud-init-local
  - cloud-config
  - cloud-final
_profile_specific_linux_enabled_services: []
profile_linux_enabled_services: "{{ _base_linux_enabled_services + _profile_specific_linux_enabled_services }}"

_base_linux_disabled_services: []
_profile_specific_linux_disabled_services: []
profile_linux_disabled_services: "{{ _base_linux_disabled_services + _profile_specific_linux_disabled_services }}"

_base_linux_post_tasks: []
#   - include_tasks: common_linux_customizations.yml
_profile_specific_linux_post_tasks: []
profile_linux_post_tasks: "{{ _base_linux_post_tasks + _profile_specific_linux_post_tasks }}"

# STIG-compliant partition layout for osbuild blueprints. Values are osbuild "minsize" strings; cloud-init growpart
# expands the root volume at deploy time. Profiles override or extend via _profile_specific_filesystem_layout (merged
# with combine(), so a profile can change sizes for existing mounts or add new ones without repeating the full base).
_base_filesystem_layout:
  "/": "10 GiB"
  "/boot": "1 GiB"
  "/home": "1 GiB"
  "/tmp": "2 GiB"
  "/var": "5 GiB"
  "/var/log": "2 GiB"
  "/var/log/audit": "1 GiB"
_profile_specific_filesystem_layout: {}
blueprint_filesystem_layout: "{{ _base_filesystem_layout | combine(_profile_specific_filesystem_layout) }}"

# Build-time yum sources pushed to osbuild-composer before the compose. These repos are available during the build for
# installing packages but are NOT present in the final image. Entries may use Jinja ({{ os_major }}, {{ os_version }},
# {{ yum_repo_base_url }}, {{ yum_repo_gpgkey }}); Ansible resolves them per host. See rhel_targets.yml for
# the shared settings those expressions reference.
_base_build_yum_sources:
  ## Core repos (all RHEL versions)
  - id: "rhel-{{ os_major }}-for-x86_64-appstream-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - AppStream (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-appstream-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
  - id: "rhel-{{ os_major }}-for-x86_64-baseos-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - BaseOS (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-baseos-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
  - id: "rhel-{{ os_major }}-for-x86_64-supplementary-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - Supplementary (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-supplementary-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"

  ## EUS repos (RHEL 8 and 9 only)
  - id: "rhel-{{ os_major }}-for-x86_64-appstream-eus-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - AppStream EUS (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-appstream-eus-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
    os_major: ["8", "9"]
  - id: "rhel-{{ os_major }}-for-x86_64-baseos-eus-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - BaseOS EUS (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-baseos-eus-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
    os_major: ["8", "9"]
  - id: "rhel-{{ os_major }}-for-x86_64-supplementary-eus-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - Supplementary EUS (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-supplementary-eus-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
    os_major: ["8", "9"]

  ## Pending approval; uncomment when confirmed
  # - id: "epel"
  #   name: "Extra Packages for Enterprise Linux {{ os_major }} - x86_64"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/epel"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-EPEL-{{ os_major }}"
  #   enabled: 0
  # - id: "epel-modular"
  #   name: "Extra Packages (Modular) for Enterprise Linux {{ os_major }} - x86_64"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/epel-modular"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-EPEL-{{ os_major }}"
  #   enabled: 0
  # - id: "docker-ce-stable"
  #   name: "Docker CE Stable - x86_64"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/docker-ce-stable"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-docker-ce"
  #   enabled: 0
  # - id: "docker-ce-edge"
  #   name: "Docker CE Edge - x86_64"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/docker-ce-edge"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-docker-ce"
  #   enabled: 0
  # - id: "satellite-client-6-for-rhel-{{ os_major }}-x86_64-rpms"
  #   name: "Red Hat Satellite Client 6 for RHEL {{ os_major }} x86_64 (RPMs)"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/satellite-client-6-for-rhel-{{ os_major }}-x86_64-rpms"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-redhat-release"
  #   enabled: 0
  # - id: "satellite-client-6-for-rhel-{{ os_major }}-x86_64-eus-rpms"
