  #   enabled: 0
  #   os_major: ["8", "9"]
_profile_specific_build_yum_sources: []
_cloud_build_yum_sources: []
build_yum_sources: "{{ _base_build_yum_sources + _profile_specific_build_yum_sources + _cloud_build_yum_sources }}"

# Final-image yum repos (baked into /etc/yum.repos.d/ in the built image). Currently identical to build_yum_sources.
# If the runtime list needs to diverge from the build list in the future, copy the _base + _profile_specific
# composition pattern from build_yum_sources above and add _profile_specific_blueprint_yum_repos overrides to the
# profile files (profile_database.yml, profile_appserver.yml, etc.).
blueprint_yum_repos: "{{ build_yum_sources }}"
