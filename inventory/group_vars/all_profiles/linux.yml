  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-redhat-release"
  #   enabled: 0
  #   os_major: ["8", "9"]
  # - id: "codeready-builder-for-rhel-{{ os_major }}-x86_64-rpms"
  #   name: "Red Hat CodeReady Linux Builder for RHEL {{ os_major }} x86_64 (RPMs)"
  #   baseurl: "http://{{ yum_repo_base_url }}/redhat{{ os_major }}/codeready-builder-for-rhel-{{ os_major }}-x86_64-rpms"
  #   gpgcheck: 1
  #   gpgkey: "https://{{ yum_repo_base_url }}/RPM-GPG-KEY-redhat-release"
  #   enabled: 0
  # - id: "codeready-builder-for-rhel-{{ os_major }}-x86_64-eus-rpms"
  #   name: "Red Hat CodeReady Linux Builder for RHEL {{ os_major }} x86_64 - EUS (RPMs)"
