---
# Variables for the "osbuild_builders" group (RHEL builder EC2 instances).
#
# This group is populated at runtime by aws_ec2.yml from instances tagged builder_type=osbuild. These are the
# machines where osbuild-composer runs.
#
# The builder_packages and validation_packages lists below are installed by roles/builder_configure/ during the "Configure
# Builders" step. The builder_configure role also conditionally enables the osbuild-composer socket only for hosts in this
# group (when: "'osbuild_builders' in group_names").
#
# The build roles pick a host from this group via round-robin modulo indexing on builder_group (derived from
# build_method in all.yml).
builder_type: osbuild

builder_packages:
  - osbuild-composer
  - composer-cli

validation_packages:
  - libguestfs-tools
  - openscap-scanner
  - openscap-utils
  - scap-security-guide
