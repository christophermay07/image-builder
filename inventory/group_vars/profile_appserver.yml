---
# Application Server: packages and configuration for application server workloads.
# Inherits common config from group_vars/all_profiles/, adds appserver-specific extras.
# See all_profiles/README.md for composition rules and YAML syntax notes.
#
# TODO: populate with actual application server requirements
profile: appserver

# Linux profile settings (RHEL only for this profile).
_profile_specific_linux_packages: []
#   - compat-c++-12
#   - libatomic
_profile_specific_linux_enabled_services: []
#   - tuned
#   - uuidd
_profile_specific_linux_post_tasks: []

# Yum repo overrides (build-time sources; runtime repos follow automatically).
_profile_specific_build_yum_sources:
  - id: "rhel-{{ os_major }}-for-x86_64-highavailability-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - High Availability (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-highavailability-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
  - id: "rhel-{{ os_major }}-for-x86_64-highavailability-eus-rpms"
    name: "Red Hat Enterprise Linux {{ os_major }} for x86_64 - High Availability EUS (RPMs)"
    baseurl: "https://{{ yum_repo_base_url }}/redhat{{ os_major }}/{{ os_version }}/rhel-{{ os_major }}-for-x86_64-highavailability-eus-rpms"
    gpgcheck: 1
    gpgkey: "{{ yum_repo_gpgkey }}"
    os_major: ["8", "9"]

# Filesystem layout overrides (merged on top of _base_filesystem_layout via combine()).
_profile_specific_filesystem_layout: {}
#   "/app": "20 GiB"
