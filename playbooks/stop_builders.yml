---
# Stop builder EC2 instances after the pipeline completes. Last step in the pipeline (site.yml) and AAP workflow.
#
# Like start_builders.yml, runs entirely on localhost (connection: local). No SSH just AWS API calls to stop the
# instances.
#
# In the AAP workflow, this is wired as an always_nodes target from the Distribute step, which waits for all build
# branches to finish. So builders are stopped regardless of whether builds succeed or fail, and only after all
# in-progress work completes.
#
# Uses the same builder_instance_tags filter (from group_vars/all.yml) as start_builders.yml to find instances. Stopped
# instances retain their EBS volumes; all installed tooling, caches, and configuration survive for the next run
- name: Stop builder EC2 instances
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Find running builder instances by tag
      amazon.aws.ec2_instance_info:
        region: "{{ aws_builder_region }}"
        filters: "{{ builder_instance_tags | combine({'instance-state-name': 'running'}) }}"
      register: builder_instances

    - name: Report discovered builders
      ansible.builtin.debug:
        msg: >-
          Found {{ builder_instances.instances | length }} running builder instance(s):
          {{ builder_instances.instances | map(attribute='instance_id') | list }}

    - name: Stop builder instances
      amazon.aws.ec2_instance:
        region: "{{ aws_builder_region }}"
        instance_ids: "{{ builder_instances.instances | map(attribute='instance_id') | list }}"
        state: stopped
        wait: true
      when: builder_instances.instances | length > 0
      register: stop_result

    # TODO: How are we alerting if some fail to stop?
    - name: Confirm builders are stopped
      ansible.builtin.debug:
        msg: >-
          {# changed=true means we actually stopped something; default(false) handles check mode. #}
          {# The ~ operator is Jinja2 string concatenation. #}
          {{ stop_result.changed | default(false) | ternary(
            'Stopped ' ~ (builder_instances.instances | length) ~ ' builder instance(s).',
            'No running builders found to stop.') }}
