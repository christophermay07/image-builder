---
# Windows image build pipeline.
#
# Targets Windows phantom hosts in "windows_targets:&method_packer". Same pattern as build_rhel.yml:
#   OS family (windows_targets)   → base ISO, WinRM config
#   OS version (windows_2022/...) → version string
#   Profile (profile_base/...)    → extra features
#   Method (method_packer)        → builder_group = "builders_packer"
#   Cloud (cloud_aws/...)         → cloud-specific settings, Packer builder type
#
# Phantom hosts are NOT real machines and will never be reachable via SSH; gather_facts is disabled because there's
# nothing to gather. Ansible resolves the host only so it can merge the right group_vars. The windows_image_build role
# round-robins across available builders in the builders_packer group (see that role for details). So even though
# "hosts: method_packer" looks like we're targeting machines, no SSH connection is made to any phantom host.
#
# serial is set to the number of available builders_packer, matching the pattern in build_rhel.yml. Even though Packer
# builds are more independent than osbuild composes (each launches its own temporary EC2 guest), running too many Packer
# processes on the same builder simultaneously can exhaust CPU/memory on the orchestrator. This keeps at most one build
# per builder at a time. With ephemeral 1:1 builders this evaluates to serial: 1 and is effectively a no-op.
#
# This outer play does not include windows_hardening or the pre-seal windows_compliance_scan role directly.
# windows_image_build copies their provisioner playbooks and runs Packer on a Linux builder via delegate_to.
# Packer's "ansible" provisioner starts a separate ansible-playbook process ON THE LINUX BUILDER, which reads the
# copied playbook and role files there and sends Windows modules to the temporary guest over WinRM.
# The guest executes the modules, not Ansible itself. See roles/windows_hardening/README.md for the full call chain
# and current builder-side role/variable prerequisites. Post-AMI validation is a separate step below.
#
# Use --limit to scope which Windows variants are built:
#   --limit windows_targets          # all Windows (3 builds)
#   --limit windows-2022-base-aws    # exactly one build
#   --limit 'windows_targets:&profile_base'  # Windows x base only
#
# Failure handling: same block/rescue pattern as build_rhel.yml. In AAP, this job also uses always_nodes to reach
# Distribute, so a failure here won't kill the RHEL branch.
- name: Build Windows images
  hosts: "windows_targets:&method_packer"
  gather_facts: false
  # builders_packer starts empty in the static inventory and gets filled at
  # runtime by aws_ec2.yml, so the group can be empty if builders haven't been
  # discovered yet. Ansible treats serial: 0 as "all hosts at once," not
  # "nothing to do," so clamp to at least 1 to keep one-build-per-builder
  # batching.
  serial: "{{ [groups['builders_packer'] | default([]) | length, 1] | max }}"
  tasks:
    - name: Initialize image build attempt
      ansible.builtin.include_role:
        name: image_build_initialize
        apply:
          tags: [always]
      tags: [always]

    - name: Build, validate, and publish Windows image
      block:
        - name: Build Windows image with Packer
          ansible.builtin.include_role:
            name: windows_image_build
            apply:
              tags: [build, windows, packer]
          tags: [build, windows, packer]

        - name: Validate AMI with post-AMI compliance scan
          ansible.builtin.include_role:
            name: windows_ami_validate
            apply:
              tags: [validate, windows, compliance]
          tags: [validate, windows, compliance]

        - name: Check native-image validation before publication
          ansible.builtin.include_role:
            name: image_validation_gate
            apply:
              tags: [export, windows, artifactory]
          tags: [export, windows, artifactory]

        - name: Prepare producer artifacts
          ansible.builtin.include_role:
            name: windows_artifacts_prepare
            apply:
              tags: [export, windows, artifactory]
          tags: [export, windows, artifactory]

        - name: Upload artifacts to Artifactory
          ansible.builtin.include_role:
            name: artifactory_upload
            apply:
              tags: [export, windows, artifactory]
          tags: [export, windows, artifactory]

        - name: Create Artifactory release bundle
          ansible.builtin.include_role:
            name: artifactory_release_bundle
            apply:
              tags: [export, release-bundle, windows, artifactory]
          tags: [export, release-bundle, windows, artifactory]

        - name: Approve published native image for distribution
          ansible.builtin.include_role:
            name: image_release_approve
            apply:
              tags: [export, release-bundle, windows, artifactory]
          tags: [export, release-bundle, windows, artifactory]

      rescue:
        # Same pattern as build_rhel.yml (accumulate failures on localhost since phantom hosts have no real storage)
        - name: Record build failure
          ansible.builtin.set_fact:
            _build_failed: true
            _build_error: "{{ ansible_failed_result | default(ansible_failed_task) | default('unknown error') }}"
          delegate_facts: false
          delegate_to: localhost

        - name: Append to failure list
          ansible.builtin.set_fact:
            # Read the accumulated list from localhost (may not exist yet), append this failure, and
            # write it back. delegate_to + delegate_facts stores it on localhost for the reporting play.
            build_failures: >-
              {{ (hostvars['localhost']['build_failures'] | default([])) +
                 [{'target': inventory_hostname, 'error': _build_error}] }}
          delegate_facts: true
          delegate_to: localhost

      always:
        - name: Remove isolated build workspace after all consumers finish
          ansible.builtin.file:
            path: "{{ builder_ansible_workspace }}"
            state: absent
          delegate_to: "{{ _builder_host }}"
          when: builder_ansible_workspace is defined

# Report after every serial batch; a target limit must not exclude the final failure report.
- name: Report Windows build failures
  hosts: "windows_targets:&method_packer"
  gather_facts: false
  tasks:
    - name: Report failed Windows target
      ansible.builtin.fail:
        msg: "Windows image {{ inventory_hostname }} failed: {{ _build_error }}"
      when: _build_failed | default(false) | bool
      tags: [always]
