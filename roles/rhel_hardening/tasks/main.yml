---
# RHEL hardening validation: offline FIPS verification + compliance scan.
#
# Image Builder applies FIPS and STIG during the compose. This role validates the result by mounting the built qcow2 and
# running oscap offline; no need to boot the image.

# _builder_host is inherited from rhel_image_build (set once per phantom host via round-robin; see that role).

- name: Set VM name from inventory hostname
  ansible.builtin.set_fact:
    vm_name: "{{ inventory_hostname }}"

- name: Set image path
  ansible.builtin.set_fact:
    image_path: "{{ image_output_dir }}/{{ vm_name }}.qcow2"

- name: Verify qcow2 exists
  ansible.builtin.stat:
    path: "{{ image_path }}"
  register: qcow2_stat
  failed_when: not qcow2_stat.stat.exists
  delegate_to: "{{ _builder_host }}"

- name: Verify FIPS configuration (offline)
  ansible.builtin.include_tasks: verify_fips_offline.yml

- name: Run offline compliance scan
  ansible.builtin.include_tasks: scan_offline.yml
