---
# cloud_init_prep role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.

## Role-only (not in group_vars)
# Internal implementation details and extension points; not operator-facing.

# Extra cloud-init config files to inject post-compose via guestmount. List of {filename: ..., content: ...} dicts.
# Extension point for advanced customization; override via extra-vars when needed.
cloud_init_extra_configs: []

# Temporary mount point used by guestmount during cloud-init injection.
cloud_init_mount_point: /mnt/image-cloudinit

## Cross-role, all hosts (defined in group_vars/all.yml)
# Shared paths used by multiple build and export roles.

builder_work_dir: /var/lib/image-builder
image_output_dir: "{{ builder_work_dir }}/output"

## Cross-role, osbuild method (defined in group_vars/method_osbuild.yml)
# Used by this role and rhel_image_build.

cloud_init_datasources:
  - Ec2
  - Azure
  - GCE
  - NoCloud

## REQUIRED FROM INVENTORY OR UPSTREAM FACTS (no sensible default)
# These *must* be provided by the inventory (or set by earlier roles).
# The role fails with an UndefinedError if they are missing.
#
# _builder_host    - set by rhel_image_build; delegate_to target    e.g. "osbuild-builder-01"
