---
# cloud-init configuration and datasource setup.
#
# With RHEL Image Builder, cloud-init packages and datasource configuration are baked into the image during the compose
# via the blueprint:
#   - cloud-init is installed as a [[packages]] entry
#   - Datasource config is injected via [[customizations.files]]
#   - cloud-init services are enabled via [customizations.services]
#   - The image is already sealed (no prior boot to clean up after)
#
# This role is retained for any post-compose offline customizations that cannot be expressed in the blueprint (e.g.,
# cloud-init modules that need complex YAML configuration beyond what [[customizations.files]] supports). Most builds
# will skip this role entirely.

# _builder_host is inherited from rhel_image_build (set once per phantom host via round-robin; see that role).

- name: Set VM name from inventory hostname
  ansible.builtin.set_fact:
    vm_name: "{{ inventory_hostname }}"

- name: Check if additional cloud-init customization is needed
  ansible.builtin.debug:
    msg: >-
      cloud-init datasources and services are configured in the blueprint.
      No additional post-compose customization required for {{ vm_name }}.
  when: cloud_init_extra_configs | default([]) | length == 0

- name: Apply extra cloud-init configs via guestmount (if any)
  ansible.builtin.include_tasks: inject_extra_configs.yml
  when: cloud_init_extra_configs | default([]) | length > 0
