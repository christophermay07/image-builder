---
# Attempt every cleanup operation, including after a partial launch failure; match unique attempt tags.
- name: Attempt instance termination
  block:
    - name: Perform instance termination
      amazon.aws.ec2_instance:
        filters:
          tag:image_build_id: "{{ image_build_id }}"
          tag:purpose: image-builder-validation
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
            - shutting-down
        state: terminated
        wait: true
        wait_timeout: 600
        region: "{{ aws_region }}"
        access_key: "{{ aws_build_access_key_id | default(omit, true) }}"
        secret_key: "{{ aws_build_secret_access_key | default(omit, true) }}"
        session_token: "{{ aws_build_session_token | default(omit, true) }}"
      delegate_to: "{{ _builder_host }}"
  rescue:
    - name: Record instance termination failure
      ansible.builtin.set_fact:
        _rhel_smoke_cleanup_errors: >-
          {{ _rhel_smoke_cleanup_errors + ['instance termination: ' ~ ansible_failed_result.msg] }}

- name: Attempt key-pair deletion
  block:
    - name: Perform key-pair deletion
      amazon.aws.ec2_key:
        name: "{{ _rhel_smoke_key_name }}"
        state: absent
        region: "{{ aws_region }}"
        access_key: "{{ aws_build_access_key_id | default(omit, true) }}"
        secret_key: "{{ aws_build_secret_access_key | default(omit, true) }}"
        session_token: "{{ aws_build_session_token | default(omit, true) }}"
      delegate_to: "{{ _builder_host }}"
  rescue:
    - name: Record key-pair deletion failure
      ansible.builtin.set_fact:
        _rhel_smoke_cleanup_errors: >-
          {{ _rhel_smoke_cleanup_errors + ['key-pair deletion: ' ~ ansible_failed_result.msg] }}

- name: Attempt workspace removal
  when: _rhel_smoke_workspace.path is defined
  block:
    - name: Perform workspace removal
      ansible.builtin.file:
        path: "{{ _rhel_smoke_workspace.path }}"
        state: absent
      delegate_to: "{{ _builder_host }}"
  rescue:
    - name: Record workspace removal failure
      ansible.builtin.set_fact:
        _rhel_smoke_cleanup_errors: >-
          {{ _rhel_smoke_cleanup_errors + ['workspace removal: ' ~ ansible_failed_result.msg] }}
