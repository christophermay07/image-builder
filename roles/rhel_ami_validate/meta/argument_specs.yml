---
# Defaults remain in defaults/main.yml; this file defines the role input contract.
argument_specs:
  main:
    short_description: Validate inputs for rhel_ami_validate
    options:
      ## Secrets
      aws_build_access_key_id:
        type: str
        description: Optional explicit AWS access key for build operations.
        no_log: true
      aws_build_secret_access_key:
        type: str
        description: Optional explicit AWS secret key for build operations.
        no_log: true
      aws_build_session_token:
        type: str
        description: Optional explicit AWS session token for build operations.
        no_log: true

      ## Inherited and derived values
      cloud_image_result:
        type: dict
        description: Import evidence binding the AMI to this build and canonical qcow2 checksum.
        required: true
      _builder_host:
        type: str
        description: Assigned Linux builder hostname.
        required: true
      aws_ami_id:
        type: str
        description: Imported AMI to validate.
        required: true
      image_build_id:
        type: str
        description: Unique build attempt identity.
        required: true
      build_timestamp:
        type: str
        description: Frozen timestamp of this build.
        required: true
      prepared_qcow2_sha256:
        type: str
        description: Checksum of the canonical qcow2 used for import.
        required: true
      builder_work_dir:
        type: str
        description: Base directory for temporary validation workspaces.

      ## AWS smoke test
      rhel_smoke_subnet_id:
        type: str
        description: Existing subnet reachable from the assigned builder.
        required: true
      rhel_smoke_security_group_ids:
        type: list
        description: Existing security groups allowing SSH from the builder.
        required: true
        elements: str
      aws_region:
        type: str
        description: Region containing the imported AMI.
      rhel_smoke_instance_type:
        type: str
        description: Instance type compatible with the image architecture.
      rhel_smoke_ssh_user:
        type: str
        description: Expected normal cloud-init login user.
      rhel_smoke_ssh_port:
        type: int
        description: SSH port on the validation guest.
      rhel_smoke_ssh_timeout:
        type: int
        description: Maximum SSH readiness budget in seconds.
