---
# RHEL Image Builder: render blueprint, push to composer, compose, download.
#
# Called from build_rhel.yml against phantom hosts. Each phantom host (e.g. "rhel-9.4-base-aws") carries variables from
# its five inventory groups; this role doesn't need to know which OS version or profile it is; it just uses the composed
# variables. Key variables used here:
#
#   builder_group      → derived in group_vars/all.yml as "builders_{{ build_method }}"
#   blueprint_template → from group_vars/rhel_targets.yml (OS family dimension)
#   vm_name            → set from inventory_hostname (the phantom host name, e.g. "rhel-9.4-base-aws")
#
# All tasks delegate to _builder_host, which is a real EC2 instance from the builders_osbuild group (discovered by
# aws_ec2.yml).

- name: Validate Linux profile collections
  ansible.builtin.assert:
    that:
      - profile_linux_packages is sequence
      - profile_linux_packages is not string
      - profile_linux_packages is not mapping
      - profile_linux_enabled_services is sequence
      - profile_linux_enabled_services is not string
      - profile_linux_enabled_services is not mapping
      - profile_linux_disabled_services is sequence
      - profile_linux_disabled_services is not string
      - profile_linux_disabled_services is not mapping
      - stig_selected_rules is sequence
      - stig_selected_rules is not string
      - stig_selected_rules is not mapping
      - stig_unselected_rules is sequence
      - stig_unselected_rules is not string
      - stig_unselected_rules is not mapping
      - cloud_init_datasources is sequence
      - cloud_init_datasources is not string
      - cloud_init_datasources is not mapping
      - cloud_init_extra_configs is sequence
      - cloud_init_extra_configs is not string
      - cloud_init_extra_configs is not mapping
      - build_yum_sources is sequence
      - build_yum_sources is not string
      - build_yum_sources is not mapping
      - blueprint_yum_repos is sequence
      - blueprint_yum_repos is not string
      - blueprint_yum_repos is not mapping
      - blueprint_filesystem_layout is mapping
    fail_msg: Supply native profile lists and a filesystem layout mapping.

- name: Validate extra cloud-init file definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.filename is string
      - item.filename is match('^[^/\\]+[.]cfg$')
      - item.content is string
    fail_msg: Each extra cloud-init entry needs a .cfg basename and string content.
  loop: "{{ cloud_init_extra_configs }}"

- name: Validate yum repository definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id is string and item.id is match('^[A-Za-z0-9_][A-Za-z0-9_.:-]*$')
      - item.baseurl is string and item.baseurl | trim | length > 0
    fail_msg: Repository definitions need a filename-safe ID and a non-empty base URL.
  loop: "{{ build_yum_sources + blueprint_yum_repos }}"

- name: Validate compose polling and conditional repository inputs
  ansible.builtin.assert:
    that:
      - compose_timeout_retries is integer and compose_timeout_retries > 0
      - compose_poll_interval is integer and compose_poll_interval > 0
      - >-
        (build_yum_sources | length == 0 and
         blueprint_yum_repos | selectattr('os_major', 'defined') | list | length == 0)
        or (os_major is defined and os_major is string and os_major | length > 0)
    fail_msg: Use positive integer polling settings and supply os_major when repositories require version filtering.

# Guard: if start_builders or configure_builders failed for all instances of this builder type, the group will be empty
# and the round-robin indexing would throw an error. This gives a clear message instead.
- name: Verify builders are available for delegation
  ansible.builtin.fail:
    msg: >-
      No healthy builders in group '{{ builder_group }}'. All {{ builder_group }} instances
      either failed to start or failed to configure. Cannot build {{ inventory_hostname }}.
  when: groups[builder_group] | default([]) | length == 0

# _builder_host: the single source of truth for which builder this phantom host delegates to.
#
# Set ONCE here via round-robin and inherited by every subsequent role in the play (rhel8_fstab_fixup,
# rhel_compliance_scan, rhel_artifacts_prepare, cloud_convert). Those roles do NOT set _builder_host themselves; they rely
# on the host fact persisting across include_role calls within the same play. This guarantees that the builder which
# composed the qcow2 is the same one that hardens, scans, exports, and converts it, avoiding cross-builder mismatches.
#
# Round-robin logic: each phantom host's position in the play's host list (ansible_play_hosts_all) is divided modulo
# the number of builders, spreading work evenly. With a single builder this is a no-op (N % 1 == 0). With 3 builders
# and 9 targets, targets 0/3/6 go to builder 0, targets 1/4/7 to builder 1, etc.
#
# To actually run builds in parallel, also increase serial in build_rhel.yml to match the number of builders.
- name: Set builder host for delegation (round-robin, inherited by all downstream roles)
  ansible.builtin.set_fact:
    _builder_host: >-
      {{ groups[builder_group][
         ansible_play_hosts_all.index(inventory_hostname)
         % (groups[builder_group] | length)] }}

- name: Set VM name from inventory hostname
  ansible.builtin.set_fact:
    vm_name: "{{ inventory_hostname }}"

- name: Add build-time yum sources to osbuild-composer
  ansible.builtin.include_tasks: manage_build_sources.yml
  when: build_yum_sources | default([]) | length > 0

- name: Template blueprint
  ansible.builtin.template:
    src: "{{ blueprint_template }}"
    dest: "{{ blueprint_dir }}/{{ vm_name }}.toml"
    mode: "0644"
  delegate_to: "{{ _builder_host }}"

- name: Push blueprint to osbuild-composer
  ansible.builtin.command:
    cmd: composer-cli blueprints push {{ blueprint_dir }}/{{ vm_name }}.toml
  changed_when: true
  delegate_to: "{{ _builder_host }}"

- name: Delete any previous compose for this blueprint
  ansible.builtin.include_tasks: cleanup_old_composes.yml

- name: Start compose
  ansible.builtin.command:
    cmd: composer-cli compose start {{ vm_name }} {{ compose_output_type }}
  register: compose_start
  changed_when: true
  delegate_to: "{{ _builder_host }}"

# Extract the first UUID from composer-cli's stdout (e.g. "Compose abcd1234-... added to the queue").
- name: Extract compose UUID
  ansible.builtin.set_fact:
    compose_uuid: "{{ compose_start.stdout | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}') }}"

- name: Fail if compose UUID not found
  ansible.builtin.fail:
    msg: "Could not extract compose UUID from: {{ compose_start.stdout }}"
  when: compose_uuid is not defined or compose_uuid | length == 0

- name: Wait for compose to finish
  ansible.builtin.include_tasks: wait_for_compose.yml

- name: Download compose image
  ansible.builtin.command:
    cmd: composer-cli compose image {{ compose_uuid }}
  args:
    chdir: "{{ image_output_dir }}"
  changed_when: true
  delegate_to: "{{ _builder_host }}"

# command used here because shell functionality is not needed, and there is no native rename module
- name: Rename compose output to standard name
  ansible.builtin.command: >-
    mv {{ image_output_dir }}/{{ compose_uuid }}-disk.qcow2
    {{ image_output_dir }}/{{ vm_name }}.qcow2
  changed_when: true
  delegate_to: "{{ _builder_host }}"

- name: Record compose UUID for downstream roles
  ansible.builtin.set_fact:
    build_compose_uuid: "{{ compose_uuid }}"
