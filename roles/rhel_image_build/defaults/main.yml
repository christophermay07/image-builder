---
# rhel_image_build role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.

## Role-only (not in group_vars)
# Osbuild internals, operational tuning, and runtime-computed values.
# Override any of these via extra-vars when needed.

# Standard OS path set by the scap-security-guide RPM. Only changes if the package layout changes.
# Shared with rhel_compliance_scan (which defines the same default).
stig_content_dir: /usr/share/xml/scap/ssg/content

# Only supported type today is qcow2; changing it requires code changes in downstream roles.
compose_output_type: qcow2

# Operational tuning for osbuild compose polling. 120 retries x 30s = 60 min max wait.
compose_timeout_retries: 120
compose_poll_interval: 30

# Image version baked into blueprint metadata.
# CalVer (YYYY.M.D) generated at runtime; no sensible static value to put in group_vars.
# Override with -e for manual builds. Append a suffix for multiple builds per day:
#   -e image_version_suffix=.2
#   -e image_version_suffix=.{{ awx_job_id }}
image_version_suffix: ""
image_version: "{{ now(utc=true).strftime('%Y.%m.%d') }}{{ image_version_suffix }}"

## Role-specific, Linux profiles (defined in group_vars/all_profiles/linux.yml)
# Base values are composed via the `_base` + `_profile_specific` pattern in group_vars/all_profiles/linux.yml.
# Per-profile overrides go in profile_<name>.yml.

profile_linux_packages: []
profile_linux_enabled_services: []
profile_linux_disabled_services: []
blueprint_filesystem_layout: {}

# selinux_mode - per-profile, role-only (profile_*.yml); optional, inline fallback is enforcing; e.g., "permissive"

## Cross-role, RHEL targets (defined in group_vars/rhel_targets.yml)
# Optional sources for composed repo entries; unused when selected repositories do not reference them.
# Supply a usable mirror location and signing key URL when repository definitions reference these settings.
yum_repo_base_url: ""
yum_repo_gpgkey: ""  # set in group_vars/rhel_targets.yml

## Cross-role, profile + cloud composition (defined in group_vars/all_profiles/linux.yml)
# Composed via _base + _profile_specific + _cloud pattern.

# Yum repositories rendered as [[customizations.repositories]] in the blueprint.
# These end up in /etc/yum.repos.d/ in the final image.
blueprint_yum_repos: []

# Build-time yum sources pushed to osbuild-composer before the compose starts.
# These repos are available during the build for installing packages but are NOT baked into the final image.
build_yum_sources: []

## Cross-role, RHEL targets (defined in group_vars/rhel_targets.yml + rhel_*_*.yml)
# Shared with rhel_compliance_scan (which defines the same defaults).
stig_profile: "xccdf_org.ssgproject.content_profile_stig"

# STIG tailoring rules; also recorded by rhel_artifacts_prepare in build metadata.
# Empty list means "use the base STIG profile as-is."

stig_unselected_rules: []

## Role-only (not in group_vars)
# Mirror of stig_unselected_rules for adding rules beyond the base profile.
# Empty by default; only needed for advanced tailoring.

stig_selected_rules: []

## Cross-role, all hosts (defined in group_vars/all.yml)
# Shared paths used by multiple build and export roles.

builder_work_dir: /var/lib/image-builder
blueprint_dir: "{{ builder_work_dir }}/blueprints"
image_output_dir: "{{ builder_work_dir }}/output"

## Cross-role, per cloud provider (defined in group_vars/cloud_*.yml)
# Used by this role when rendering cloud-init configuration in the blueprint.

# chrony_config - per-cloud, role-only (cloud_*.yml); optional, absence skips chrony file injection
# Example: "server 169.254.169.123"

cloud_init_datasources:
  - NoCloud

## Role-only, optional cloud-init configuration
# Extra cloud-init files baked into /etc/cloud/cloud.cfg.d/ during composition.
# Each entry supplies filename (a .cfg basename) and content (the complete YAML configuration text).
# Override in profile group_vars, host_vars, or extra-vars; an empty list adds no extra files.
cloud_init_extra_configs: []

## REQUIRED FROM INVENTORY (no sensible default)
# These *must* be provided by the inventory.
# Inputs marked required in meta/argument_specs.yml are checked at role entry.
# Unresolved references in templated inputs can also cause validation to fail.
#
# blueprint_template - per-OS-family, role-only       (rhel_targets.yml)     e.g., "rhel-blueprint.toml.j2"
# os_version         - per-version, cross-role        (rhel_*_*.yml)         e.g., "9.4"
# profile            - per-profile, cross-role        (profile_*.yml)        e.g., "base"
# stig_datastream    - per-OS-family, cross-role      (rhel_targets.yml)     derived from os_major
# builder_group      - derived builder selection (all.yml); e.g., "builders_osbuild"
# os_major           - required for non-empty build_yum_sources (rhel_targets.yml); e.g., "9"
