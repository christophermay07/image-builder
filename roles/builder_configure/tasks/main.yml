---
# Builder configuration; called by configure_builders.yml against the "builders" group (all builder types).
#
# This role installs different tooling depending on which child group the host belongs to. The group_names check below
# is how one role serves all builder types without needing separate roles per type.
#
# Variables used here come from the builder's group_vars:
#   builder_packages     → group_vars/builders_<type>.yml (e.g., builders_osbuild.yml, builders_packer.yml)
#   validation_packages  → same
#   builder_work_dir etc → group_vars/builders.yml (shared)

- name: Validate builder package lists and directories
  ansible.builtin.assert:
    that:
      - builder_packages is sequence
      - builder_packages is not string
      - builder_packages is not mapping
      - validation_packages is sequence
      - validation_packages is not string
      - validation_packages is not mapping
      - builder_work_dir is string and builder_work_dir | trim | length > 0
      - image_output_dir is string and image_output_dir | trim | length > 0
      - report_output_dir is string and report_output_dir | trim | length > 0
    fail_msg: Supply package lists and non-empty builder working and output directories.

- name: Validate osbuild blueprint directory
  ansible.builtin.assert:
    that:
      - blueprint_dir is string and blueprint_dir | trim | length > 0
    fail_msg: Supply a non-empty blueprint directory for osbuild builders.
  when: '''builders_osbuild'' in group_names'

- name: Validate Packer installation settings
  ansible.builtin.assert:
    that:
      - packer_binary is string and packer_binary | trim | length > 0
      - packer_version is string and packer_version | trim | length > 0
      - packer_download_url is string and packer_download_url | trim | length > 0
      - packer_checksum is string and packer_checksum | trim | length > 0
    fail_msg: Supply the Packer executable, version, download URL, and checksum for Packer builders.
  when: '''builders_packer'' in group_names'

# Every builder type gets its type-specific packages.
- name: Install builder packages
  ansible.builtin.dnf:
    name: "{{ builder_packages }}"
    state: present
  when: builder_packages | length > 0

- name: Install image validation tools
  ansible.builtin.dnf:
    name: "{{ validation_packages }}"
    state: present
  when: validation_packages | length > 0

# Only builders_osbuild need osbuild-composer. The group_names check ensures this doesn't run on builders_packer, which
# don't have it.
- name: Enable and start osbuild-composer socket
  ansible.builtin.systemd:
    name: osbuild-composer.socket
    state: started
    enabled: true
  when: "'builders_osbuild' in group_names"

# Shared directories for all builder types.
- name: Create work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ builder_work_dir }}"
    - "{{ image_output_dir }}"
    - "{{ report_output_dir }}"

# Only builders_osbuild use osbuild-composer blueprints.
- name: Create blueprint directory
  ansible.builtin.file:
    path: "{{ blueprint_dir }}"
    state: directory
    mode: "0755"
  when: "'builders_osbuild' in group_names"

# Only builders_packer need Packer installed.
- name: Install Packer (for Windows AMI builds)
  ansible.builtin.include_tasks: install_packer.yml
  when: "'builders_packer' in group_names"

# Each build creates an isolated Ansible environment; no shared runtime is modified during a build.
- name: Install prerequisites for isolated builder-side Ansible environments
  ansible.builtin.dnf:
    name: [python3.12, python3.12-pip, git]
    state: present
  when: "'builders_packer' in group_names"
