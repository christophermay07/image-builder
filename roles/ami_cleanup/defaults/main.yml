---
# ami_cleanup role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.

## AWS cleanup settings (defined in group_vars/cloud_aws.yml)
# Retention policy for AMI cleanup.

# Number of most-recent AMIs to keep per phantom host per region.
# Set to -1 to disable count-based cleanup (keep all).
ami_cleanup_keep_count: -1

# ISO date string (YYYY-MM-DD). AMIs created before this date are deleted regardless of keep_count. The far-past default
# effectively disables date-based cleanup.
ami_cleanup_older_than: "2000-01-01"

aws_region: us-east-1

# Additional regions for cross-region AMI copies. This role cleans up AMIs in each of these regions plus aws_region.
ami_target_regions: []

## AWS credentials (cleanup function, defined in group_vars/cloud_aws.yml)
# Optional explicit overrides: empty values are omitted, leaving authentication to the executing process.
# Authentication is still required; session tokens are needed only for credentials that use them.
# AWS queries and deletion tasks run on localhost.
# This role performs destructive AWS operations (AMI deregistration, snapshot deletion). Uses the cleanup-scoped
# credential variables from cloud_aws.yml. To split from build/distribute, override the aws_cleanup_* vars.
aws_cleanup_access_key_id: ""
aws_cleanup_secret_access_key: ""
aws_cleanup_session_token: ""

## Cloud dispatch
# Based on group membership ("'cloud_aws' in group_names").
# cloud_target (string) is available for logging.
