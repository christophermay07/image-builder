---
# AWS distribution: copy AMIs across regions and share with target accounts.
# Uses aws_distribute_* credentials (distribute function). Override to split from build/cleanup.

# Every producer supplies a verified published image; source selection never falls back to OS-specific facts.
- name: Require AWS branch inputs
  ansible.builtin.assert:
    that:
      - _builder_host is string and _builder_host | trim | length > 0
      - profile is string and profile | trim | length > 0
      - os_version is string and os_version | trim | length > 0
      - aws_region is string and aws_region | trim | length > 0
      - ami_target_regions is sequence and ami_target_regions is not string and ami_target_regions is not mapping
      - ami_target_accounts is sequence and ami_target_accounts is not string and ami_target_accounts is not mapping
      - ami_base_tags is defined
      - ami_base_tags is mapping

- name: Validate distribution region names
  ansible.builtin.assert:
    that:
      - item is string and item | trim | length > 0
    fail_msg: Distribution regions must be non-empty strings.
  loop: "{{ ami_target_regions }}"

- name: Validate distribution account IDs
  ansible.builtin.assert:
    that:
      - item is string and item is match('^[0-9]{12}$')
    fail_msg: Distribution account IDs must be quoted 12-digit strings.
  loop: "{{ ami_target_accounts }}"

- name: Verify AWS publication approval
  ansible.builtin.include_tasks: verify_aws.yml

- name: Select approved source AMI
  ansible.builtin.set_fact:
    _source_ami: "{{ _published_image.image_id }}"

- name: Copy AMI to target regions
  amazon.aws.ec2_ami_copy:
    source_region: "{{ aws_region }}"
    source_image_id: "{{ _source_ami }}"
    region: "{{ target_region }}"
    name: "{{ vm_name }}"
    description: "{{ vm_name }} - {{ profile }} - {{ os_version }}"
    tags: >-
      {{ ami_base_tags | combine({
         'source_region': aws_region,
         'source_ami': _source_ami}) }}
    wait: true
    access_key: "{{ aws_distribute_access_key_id | default(omit, true) }}"
    secret_key: "{{ aws_distribute_secret_access_key | default(omit, true) }}"
    session_token: "{{ aws_distribute_session_token | default(omit, true) }}"
  loop: "{{ ami_target_regions }}"
  loop_control:
    loop_var: target_region
  register: ami_copies
  delegate_to: "{{ _builder_host }}"
  when: ami_target_regions | length > 0

- name: Share AMI with target accounts (source region)
  amazon.aws.ec2_ami:
    image_id: "{{ _source_ami }}"
    region: "{{ aws_region }}"
    launch_permissions:
      user_ids: "{{ ami_target_accounts }}"
    state: present
    access_key: "{{ aws_distribute_access_key_id | default(omit, true) }}"
    secret_key: "{{ aws_distribute_secret_access_key | default(omit, true) }}"
    session_token: "{{ aws_distribute_session_token | default(omit, true) }}"
  delegate_to: "{{ _builder_host }}"
  when: ami_target_accounts | length > 0

- name: Share copied AMIs with target accounts (other regions)
  amazon.aws.ec2_ami:
    image_id: "{{ ami_copy.image_id }}"
    region: "{{ ami_copy.target_region }}"
    launch_permissions:
      user_ids: "{{ ami_target_accounts }}"
    state: present
    access_key: "{{ aws_distribute_access_key_id | default(omit, true) }}"
    secret_key: "{{ aws_distribute_secret_access_key | default(omit, true) }}"
    session_token: "{{ aws_distribute_session_token | default(omit, true) }}"
  loop: "{{ ami_copies.results | default([]) }}"
  loop_control:
    loop_var: ami_copy
    label: "{{ ami_copy.target_region | default('N/A') }}"
  when:
    - ami_target_accounts | length > 0
    - ami_copies.results is defined
  delegate_to: "{{ _builder_host }}"

- name: Log distribution summary
  ansible.builtin.debug:
    msg: >-
      AMI {{ _source_ami }} ({{ vm_name }}) distributed:
      regions={{ ([aws_region] + ami_target_regions) | join(', ') }},
      {# NOTE: join always returns a string, so default('none') only fires if the var is undefined, #}
      {# not if the list is empty (join on [] returns ''). An empty list shows as blank here. #}
      shared_with={{ ami_target_accounts | join(', ') | default('none') }}
