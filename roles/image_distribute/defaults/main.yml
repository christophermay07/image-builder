---
# image_distribute role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.

## Cross-role, all hosts (defined in group_vars/all.yml)
# AMI distribution targets; also used by ami_cleanup.

ami_target_regions: []

## Role-specific, all hosts (defined in group_vars/all.yml)
# Accounts to share AMIs with; only used by this role.

ami_target_accounts: []

## Cross-role, all hosts (defined in group_vars/all.yml)
# Shared settings used by multiple roles.

aws_region: us-east-1

## AWS credentials (distribute function)
# This role performs distribution-phase AWS operations (AMI copy, account sharing). Uses the distribute-scoped
# credential variables from group_vars/all.yml. To split from build/cleanup, override the aws_distribute_* vars.
aws_distribute_access_key_id: ""
aws_distribute_secret_access_key: ""
aws_distribute_session_token: ""

## REQUIRED FROM INVENTORY OR UPSTREAM FACTS (no sensible default)
# These *must* be provided by the inventory (or set by earlier roles).
# The role fails with an UndefinedError if they are missing.
#
# cloud_targets    - per-profile, cross-role      (profile_*.yml)          e.g. ["aws", "azure"]
# os_family        - per-OS-family                (rhel*_targets.yml)      e.g. "rhel9"
# os_version       - per-version, cross-role      (rhel_*_*.yml)           e.g. "9.4"
# profile          - per-profile, cross-role      (profile_*.yml)          e.g. "base"

## Upstream facts (set by earlier plays or roles)
# Registered or set_fact variables from earlier stages. Tasks use | default() fallbacks.
#
# _builder_host    - inventory hostname of the builder (set_fact from earlier play)
# aws_ami_id       - AMI ID from image upload (| default chain to windows_ami_id)
# windows_ami_id   - fallback AMI ID for Windows builds
