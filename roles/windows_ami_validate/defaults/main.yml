---
# windows_ami_validate role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.
#
# Boots a fresh EC2 instance from the newly created Windows AMI, runs a
# PowerSTIG compliance scan against it (the "post-AMI scan"), downloads
# results, and terminates the instance. This validates the shipped
# artifact, not the pre-Sysprep build state.
#
# See ADR-IF-031 for the full rationale.

## Role-only (not in group_vars)
# Operational tuning, guest-internal paths, and minor toggles; not operator-facing.
# Override via extra-vars when needed.

# Instance type for the validation EC2 instance. Does not need to be as
# large as the build instance; the scan is the only workload.
validate_instance_type: "m5.large"

# How long to wait for WinRM to become available on the validation
# instance (seconds). Includes Windows boot time + userdata execution.
validate_winrm_timeout: 900

# WinRM port for the validation instance. Standard WinRM HTTPS port.
validate_winrm_port: 5986

# Output directory on the validation instance for scan results. Path inside the VM, not the builder host.
validate_compliance_output_dir: 'C:\compliance-results'

# Toggle HTML summary report generation.
validate_generate_html: true

# Prefix for post-AMI scan result filenames (distinguishes from
# pre-seal scan results in the same report directory).
validate_result_prefix: "post-seal"

## Role-specific, Windows targets (defined in group_vars/windows_targets.yml)
# The post-AMI scan must use the same PowerSTIG version and STIG checklist as the pre-seal scan
# (windows_compliance_scan role). Both roles reference the shared vars from windows_targets.yml.
# These validate_* aliases exist so tasks/main.yml can pass them as -e overrides to the child
# ansible-playbook without the naming collision (the child receives them as powerstig_version /
# powerstig_stig_id, which is what windows_compliance_scan expects).

validate_powerstig_version: "{{ powerstig_version }}"
validate_powerstig_stig_id: "{{ powerstig_stig_id }}"

## Cross-role, all hosts (defined in group_vars/all.yml)
# Shared settings used by multiple roles.

builder_work_dir: /var/lib/image-builder
report_output_dir: "{{ builder_work_dir }}/reports"
aws_region: us-east-1

## AWS credentials (build function)
# Reuses the build-scoped credential variables. The validation instance
# is part of the build process, not distribution.
aws_build_access_key_id: ""
aws_build_secret_access_key: ""
aws_build_session_token: ""

## REQUIRED FROM INVENTORY OR UPSTREAM FACTS (no sensible default)
# These *must* be provided by the inventory (or set by earlier roles).
# The role fails with an UndefinedError if they are missing.
#
# windows_ami_id          - set by windows_image_build (AMI to validate)
# packer_winrm_password   - reused for validation bootstrap
# _builder_host           - inherited from windows_image_build
# vm_name                 - set from inventory_hostname
