---
# image_release_publish role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.

## Cross-role, all hosts (defined in group_vars/all.yml)
# Shared paths and Artifactory settings used by multiple roles.

builder_work_dir: /var/lib/image-builder
report_output_dir: "{{ builder_work_dir }}/reports"

artifactory_base_url: "https://artifactory.internal"
artifactory_image_repo: "libs-release-local/images"

## Role-only (computed at runtime)
# Duplicated across image_export, artifactory_release_bundle, cloud_convert, and this role.

build_timestamp: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"

## Required secrets (no default; must be injected via AAP credential or vault)
# Uses the scan-upload-scoped Artifactory token from group_vars/all.yml. To split from image uploads or release
# bundles, override artifactory_token_scan_upload without changing this role.
#
# artifactory_token_scan_upload  - AAP/vault-injected API token for scan-result uploads to Artifactory
artifactory_token_scan_upload: ""

## REQUIRED FROM INVENTORY OR UPSTREAM FACTS (no sensible default)
# These *must* be provided by the inventory (or set by earlier roles).
# The role fails with an UndefinedError if they are missing.
#
# os_family              - per-OS-family              (rhel*_targets.yml)    e.g. "rhel9"
# os_version             - per-version, cross-role    (rhel_*_*.yml)         e.g. "9.4"
# profile                - per-profile, cross-role    (profile_*.yml)        e.g. "base"
# build_method           - per-method, cross-role     (method_*.yml)         e.g. "osbuild"
# source_ami             - per-profile, cross-role    (profile_*.yml)        source AMI for the build
# cloud_targets          - per-profile, cross-role    (profile_*.yml)        e.g. ["aws", "azure"]
# image_version          - from rhel_image_build      (| default('unknown') in template)
# windows_stig_role      - from Windows STIG role     (| default('N/A') in template)

## Forward-looking placeholders (| default chains in templates)
# These are not yet set by any upstream role or play; templates fall back via | default() chains.
#
# cloud_image_id         - cloud image identifier (| default chain to windows_ami_id)
# source_image           - source image identifier (| default chain to source_ami)

## Upstream facts (set by earlier plays or roles)
# Registered or set_fact variables from earlier stages. Templates use | default() fallbacks.
#
# _builder_host          - inventory hostname of the builder (set_fact from earlier play)
# windows_ami_id         - AMI ID for Windows builds (used as fallback in default chains)
