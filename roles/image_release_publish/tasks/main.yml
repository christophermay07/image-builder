---
# Upload Packer build scan results and metadata to Artifactory.
# Packer builds produce cloud-native images (no qcow2); only compliance artifacts.

# _builder_host is inherited from windows_image_build (set once per phantom host via round-robin; see that role).

- name: Set VM name from inventory hostname
  ansible.builtin.set_fact:
    vm_name: "{{ inventory_hostname }}"

- name: Generate build metadata
  ansible.builtin.template:
    src: build-metadata.json.j2
    dest: "{{ report_output_dir }}/{{ vm_name }}/build-metadata.json"
    mode: "0644"
  delegate_to: "{{ _builder_host }}"

- name: Push scan results to Artifactory
  ansible.builtin.include_tasks: push_artifactory.yml
