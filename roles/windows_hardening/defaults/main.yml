# windows_hardening role defaults
#
# Every variable the role consumes is listed here so the role is self-documenting.
# Sections describe where the authoritative definition lives in this project's inventory.
#
# Packer launches Ansible on the Linux builder to read this role and apply Windows modules to the guest over WinRM.
# The guest does not run Ansible. The outer build_windows.yml includes windows_image_build, which renders the
# provisioner playbook that calls this role. See README.md for the execution contract and builder prerequisites.
# These are inner-run defaults; outer inventory overrides require explicit pass-through or inner-run loading.

## Role-only (not in group_vars)
# STIG PROVIDER: Ansible Lockdown (selected per Windows version)
#
# This role uses the Ansible Lockdown standalone role for STIG remediation. The coupling points are:
#
#   1. windows_stig_role (below): the role name to include
#   2. Rule overrides must be loaded in the builder-side Ansible variable namespace, not just the outer inventory.
#   3. The builder-side Ansible process must be able to discover win2022stig (pinned in ../../requirements.yml).
#      AAP project sync does not install the role on the Linux builder.
#
# To replace Ansible Lockdown with another provider (e.g. PowerSTIG for both remediation AND scanning):
#   - Change windows_stig_role to the new role's name, or replace the include_role task in tasks/main.yml with the new
#     provider's tasks.
#   - Replace provider-specific rule override variables with the new provider's equivalents.
#   - Update requirements.yml and ensure the builder-side Ansible environment has the new dependencies.
#   - Note: windows_compliance_scan already uses PowerSTIG for auditing; if remediation also moves to PowerSTIG,
#     consider whether the two roles should be merged.
#
# MindPoint Group / Ansible Lockdown STIG rule overrides
# The handoff accepts boolean wnYY_XX_NNNNNN toggles, where YY is the two-digit Windows version, XX is a two-letter
# lowercase rule prefix, and NNNNNN is the six-digit control number. Use the selected provider's actual rule names.
#
# These are native MindPoint/Lockdown variables, not variables owned by this role. They are picked up from the Ansible
# inner-run variable namespace automatically; they do NOT need to be passed via include_role vars:.
#
# Example:
#   wn22_cc_000500: false  # Defer WinRM Service Basic auth (V-254381) during build. See ADR-IB-025.

## Role-specific, Windows profiles (defined in group_vars/all_profiles/windows.yml)
# Per-profile customization; defaults produce a minimal configuration.

profile_windows_extra_features: []
profile_windows_registry_entries: {}

## REQUIRED FROM INVENTORY OR CALLER (no sensible default)
# These *must* be provided by the inventory or caller.
# Inputs marked required in meta/argument_specs.yml are checked at role entry.
# Unresolved references in templated inputs can also cause validation to fail.
#
# windows_stig_role - per-OS-version, cross-role (group_vars/windows_*.yml)
# The outer build forwards this selection; standalone callers must supply it explicitly.
