---
# Defaults remain in defaults/main.yml; this file defines the role input contract.
argument_specs:
  main:
    short_description: Validate inputs for cloud_convert
    options:
      ## Secrets
      aws_build_access_key_id:
        type: str
        description: Optional explicit AWS access key ID for build operations.
        no_log: true
      aws_build_secret_access_key:
        type: str
        description: Optional explicit AWS secret access key for build operations.
        no_log: true
      aws_build_session_token:
        type: str
        description: Optional explicit AWS session token for build operations.
        no_log: true

      ## Inherited and derived values
      _builder_host:
        type: str
        description: Assigned Linux builder hostname from the build role.
        required: true
      prepared_qcow2_sha256:
        type: str
        description: Checksum of the prepared canonical qcow2.
      image_build_id:
        type: str
        description: Current build attempt identity.
      vm_name:
        type: str
        description: Image target name; normally derived from inventory_hostname.
      build_timestamp:
        type: str
        description: Shared build timestamp used for artifact paths and release versioning.

      ## Build target identity
      cloud_target:
        type: str
        description: Cloud provider matching the target inventory cloud group.
        required: true
        choices: [aws, azure, gcp]
      os_family:
        type: str
        description: Operating system family selected by the target inventory.
      os_version:
        type: str
        description: Operating system release selected by the target inventory.
      profile:
        type: str
        description: Inventory profile selecting image packages, services, and customization.

      ## Working and output directories
      builder_work_dir:
        type: str
        description: Base directory for builder workspaces and artifacts.
      image_output_dir:
        type: str
        description: Builder directory containing composed images and converted artifacts.

      ## AWS conversion
      aws_region:
        type: str
        description: AWS region where the role performs its source image operations.
      ami_import_bucket:
        type: str
        description: Existing S3 bucket used to stage the raw image for AMI import.
      ami_base_tags:
        type: dict
        description: Tag mapping applied to images created or copied by the pipeline.
