---
# Convert on the AWS builder; target-cloud upload and registration belong in this provider handler.
- name: Set unique Azure conversion output
  ansible.builtin.set_fact:
    _azure_import_vhd: "{{ image_output_dir }}/{{ vm_name }}-{{ image_build_id }}.vhd"

- name: Convert qcow2 to VHD format
  ansible.builtin.command:
    argv:
      - qemu-img
      - convert
      - -f
      - qcow2
      - -O
      - vpc
      - -o
      - subformat=fixed,force_size
      - "{{ image_output_dir }}/{{ vm_name }}.qcow2"
      - "{{ _azure_import_vhd }}"
  changed_when: true
  delegate_to: "{{ _builder_host }}"

# TODO: Upload _azure_import_vhd to Azure storage and register a native image, checking Azure disk requirements.
# TODO: Wait for native image provisioning to finish before returning a registered image.
# TODO: Record cloud_image_result with provider=azure, image_id, location, build_id, and qcow2_sha256.
# location is the Azure image region; image_id must identify the registered native image, not its storage blob.
- name: Stop until Azure image registration is implemented
  ansible.builtin.fail:
    msg: >-
      TODO: Implement Azure upload and native image registration in cloud_convert.
      No registered image is available for SSH validation; Artifactory publication is blocked.
