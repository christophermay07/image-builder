---
# Convert qcow2 to VHD for Azure.
- name: Convert qcow2 to VHD format
  ansible.builtin.command:
    cmd: >-
      qemu-img convert -f qcow2 -O vpc -o subformat=fixed,force_size
      {{ image_output_dir }}/{{ vm_name }}.qcow2
      {{ image_output_dir }}/{{ vm_name }}.vhd
  changed_when: true
  delegate_to: "{{ _builder_host }}"

# TODO: Upload VHD to Azure Blob Storage and register as managed image
# This requires Azure CLI or azure.azcollection modules.
# Placeholder for Azure upload logic:
- name: Upload VHD to Azure (placeholder)
  ansible.builtin.debug:
    msg: >-
      TODO: Upload {{ image_output_dir }}/{{ vm_name }}.vhd to Azure Blob Storage
      and register as a managed image. Requires Azure credentials and
      azure.azcollection or az CLI.
  delegate_to: "{{ _builder_host }}"
