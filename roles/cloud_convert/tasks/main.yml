---
# Convert qcow2 to cloud-native image formats.
# Dispatches to provider-specific task files based on cloud group membership.
# Each phantom host belongs to exactly one cloud group (cloud_aws, cloud_azure, cloud_gcp).
# Internet is assumed available on first boot, so cloud-init installs vendor agents.
# Registration records a native image identity for downstream validation; this stage never publishes to Artifactory.

# _builder_host is inherited from rhel_image_build (set once per phantom host via round-robin; see that role).

- name: Validate cloud dispatch
  ansible.builtin.assert:
    that:
      - group_names | intersect(['cloud_aws', 'cloud_azure', 'cloud_gcp']) | length == 1
      - cloud_target is string
      - ('cloud_' ~ cloud_target) in group_names
    fail_msg: 'The target must belong to exactly one supported cloud group: cloud_aws, cloud_azure, or cloud_gcp.'

- name: Validate conversion workspace
  ansible.builtin.assert:
    that:
      - _builder_host is string and _builder_host | trim | length > 0
      - image_output_dir is string and image_output_dir | trim | length > 0
    fail_msg: Supply the assigned builder and input image directory before conversion.

- name: Set VM name from inventory hostname
  ansible.builtin.set_fact:
    vm_name: "{{ inventory_hostname }}"

- name: Verify source image before cloud conversion
  ansible.builtin.stat:
    path: "{{ image_output_dir }}/{{ vm_name }}.qcow2"
    follow: true
    get_checksum: false
  register: _convert_image
  failed_when: not (_convert_image.stat.isreg | default(false))
  delegate_to: "{{ _builder_host }}"

- name: Clear previous registered image identity
  ansible.builtin.set_fact:
    cloud_image_result: {}

- name: Convert for AWS (qcow2 -> AMI)
  ansible.builtin.include_tasks: convert_aws.yml
  when: "'cloud_aws' in group_names"

- name: Convert for Azure (qcow2 -> VHD)
  ansible.builtin.include_tasks: convert_azure.yml
  when: "'cloud_azure' in group_names"

- name: Convert for GCP (qcow2 -> raw -> tar.gz)
  ansible.builtin.include_tasks: convert_gcp.yml
  when: "'cloud_gcp' in group_names"

- name: Require native image registration from selected provider
  ansible.builtin.assert:
    that:
      - cloud_image_result is mapping
      - cloud_image_result.provider | default('') == cloud_target
      - ('cloud_' ~ cloud_target) in group_names
      - cloud_image_result.build_id | default('') == image_build_id
      - cloud_image_result.qcow2_sha256 | default('') == prepared_qcow2_sha256
      - cloud_image_result.image_id | default('') is string
      - cloud_image_result.image_id | default('') | length > 0
      - cloud_image_result.location | default('') is string
      - cloud_image_result.location | default('') | length > 0
    fail_msg: The provider must register a native image and record its identity, source checksum, and current build ID.
