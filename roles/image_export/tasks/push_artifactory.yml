---
# Push the release bundle (qcow2 + reports) to Artifactory.
# Uses artifactory_token_image_upload (image-upload function). Override to split from scan/release-bundle tokens.
- name: Set Artifactory upload path
  ansible.builtin.set_fact:
    artifactory_upload_path: >-
      {{ artifactory_base_url }}/{{ artifactory_image_repo }}/{{ vm_name }}/{{ build_timestamp }}

- name: Upload qcow2 to Artifactory
  ansible.builtin.uri:
    url: "{{ artifactory_upload_path }}/{{ vm_name }}.qcow2"
    method: PUT
    src: "{{ image_output_dir }}/release/{{ vm_name }}/{{ vm_name }}.qcow2"
    headers:
      Authorization: "Bearer {{ artifactory_token_image_upload | default(omit) }}"
    status_code: [201]
    remote_src: true
  delegate_to: "{{ _builder_host }}"

- name: Upload compliance report to Artifactory
  ansible.builtin.uri:
    url: "{{ artifactory_upload_path }}/oscap-report.html"
    method: PUT
    src: "{{ image_output_dir }}/release/{{ vm_name }}/{{ vm_name }}-oscap-report.html"
    headers:
      Authorization: "Bearer {{ artifactory_token_image_upload | default(omit) }}"
    status_code: [201]
    remote_src: true
  delegate_to: "{{ _builder_host }}"

- name: Upload scan results to Artifactory
  ansible.builtin.uri:
    url: "{{ artifactory_upload_path }}/oscap-results.xml"
    method: PUT
    src: "{{ image_output_dir }}/release/{{ vm_name }}/{{ vm_name }}-oscap-results.xml"
    headers:
      Authorization: "Bearer {{ artifactory_token_image_upload | default(omit) }}"
    status_code: [201]
    remote_src: true
  delegate_to: "{{ _builder_host }}"

- name: Upload build metadata to Artifactory
  ansible.builtin.uri:
    url: "{{ artifactory_upload_path }}/build-metadata.json"
    method: PUT
    src: "{{ image_output_dir }}/release/{{ vm_name }}/{{ vm_name }}-build-metadata.json"
    headers:
      Authorization: "Bearer {{ artifactory_token_image_upload | default(omit) }}"
    status_code: [201]
    remote_src: true
  delegate_to: "{{ _builder_host }}"
