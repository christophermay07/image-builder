---
# Defaults remain in defaults/main.yml; this file defines the role input contract.
argument_specs:
  main:
    short_description: Prepare Windows metadata and the upload manifest
    options:
      _builder_host:
        type: str
        description: Assigned builder holding the artifacts.
        required: true
      build_timestamp:
        type: str
        description: Frozen build timestamp.
        required: true
      report_output_dir:
        type: str
        description: Directory containing build evidence.
        required: true
      cloud_image_result:
        type: dict
        description: Native image identity.
        required: true
      image_validation_result:
        type: dict
        description: Successful validation evidence.
        required: true
      os_family:
        type: str
        description: OS provenance.
        required: true
      os_version:
        type: str
        description: OS release provenance.
        required: true
      profile:
        type: str
        description: Build profile provenance.
        required: true
      build_method:
        type: str
        description: Build method provenance.
        required: true
      cloud_target:
        type: str
        description: Cloud provider provenance.
        required: true
      builder_work_dir:
        type: str
        description: Base directory for builder artifacts; used to derive the default report path.
      image_version:
        type: str
        description: Image version recorded in metadata; omitted values are recorded as unknown.
      source_image:
        type: str
        description: Source image recorded in metadata; defaults to source_ami when present, otherwise N/A.
      source_ami:
        type: str
        description: Optional source-image provenance for the AWS producer.
      windows_stig_role:
        type: str
        description: Hardening role recorded in metadata; omitted values are recorded as N/A.
