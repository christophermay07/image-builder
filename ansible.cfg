[defaults]
roles_path = roles
inventory = inventory
host_key_checking = False
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, yaml, ini

[privilege_escalation]
become = True
# The outer Ansible run only ever SSH's to Linux builders (even Windows plays delegate_to a Linux builder). Packer's
# Ansible provisioner uses its own config, so sudo is correct for every host the outer run touches. The one exception
# is windows_ami_validate, which spawns child ansible-playbook / ansible processes that reach Windows over WinRM;
# that role's block-level environment sets ANSIBLE_BECOME=false for all child processes.
become_method = sudo
